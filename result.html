<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> - تنبيه أمني - </title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e272e; color: white; padding: 20px; padding-top: 100px; }
        .alert-card { background: #eb4d4b; padding: 40px; border-radius: 25px; display: inline-block; max-width: 550px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 2px solid #ff7979; }
        h1 { font-size: 38px; margin-bottom: 25px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .warning-text { font-size: 24px; line-height: 1.6; font-weight: bold; background: rgba(0,0,0,0.2); padding: 25px; border-radius: 15px; margin-bottom: 25px; border-right: 5px solid white; }
        p { font-size: 18px; opacity: 0.9; }
        .footer { margin-top: 30px; font-size: 14px; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="alert-card">
        <h1> !كنت ضحية اصطياد  </h1>

        <div class="warning-text">
            ⚠️ الضغط على الروابط مهارة، والحذر منها احتراف.<br><br>
            اليوم صورتك عندنا، بكرة بياناتك وين ممكن تكون؟
        </div>

        <p> هذا الرابط كان مجرد تجربة توعوية  </p>
      
        <div class="footer">قسم أمن المعلومات - حملة التوعية الرقمية 2026 🛡️</div>
    </div>
</body>
</html>
