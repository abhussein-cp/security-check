<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنبيه أمني - IT Security</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: white; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .alert-card { 
            background: #1e1e1e; 
            padding: 40px; 
            border-radius: 20px; 
            max-width: 500px; 
            border-top: 8px solid #d63031;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        .main-title { color: #d63031; font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        .warning-box { 
            background: rgba(214, 48, 49, 0.1); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px dashed #d63031;
            margin-bottom: 25px;
        }
        .highlight-text { font-size: 22px; line-height: 1.6; font-weight: bold; color: #fff; }
        p { font-size: 17px; opacity: 0.8; line-height: 1.5; }
        .footer { 
            margin-top: 30px; 
            font-size: 14px; 
            color: #bdc3c7; 
            border-top: 1px solid #333; 
            padding-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="alert-card">
        <div class="main-title">!كنت ضحية اصطياد</div>
        
        <div class="warning-box">
            <div class="highlight-text">
                ⚠️ الضغط على الروابط مهارة، والحذر منها احتراف.<br><br>
                اليوم صورتك عندنا، بكرة بياناتك وين ممكن تكون؟
            </div>
        </div>

        <p>هذا الرابط كان مجرد تجربة توعوية تهدف لحمايتك وفهم مخاطر الروابط مجهولة المصدر.</p>
        
        <div class="footer">
            قسم أمن المعلومات - حملة التوعية الرقمية 2026 🛡️
        </div>
    </div>
</body>
</html>
